<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d22" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="HunChess: a hundred players, one move at a time. Play better moves than the field." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HunChess" />
    <script>
      // The theme, before the first paint: this device's pick (Settings), else the device's own
      // setting. src/theme.ts keeps it in step after this, by the same rules (a unit test checks they agree).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("brc.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          try {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } catch (e) {
            t = "dark";
          }
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>HunChess</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
