<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d22" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="HunChess: a hundred players, one move at a time. Play better moves than the field." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HunChess" />
    <script>
      // The theme, before the first paint: this device's pick (Settings), else the device's own
      // setting. src/theme.ts keeps it in step after this, by the same rules (a unit test checks they agree).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("brc.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          try {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          } catch (e) {
            t = "dark";
          }
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script>
      // A script that won't load (the app's own is in <head>, so this listens from here): the loading bar says so (below).
      addEventListener("error", function (e) {
        if (!e.target || e.target.tagName !== "SCRIPT") return;
        window.hcLoadFailed = true;
        if (window.hcLoadFail) window.hcLoadFail();
      }, true);
    </script>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>HunChess</title>
    <style>
      /* The shell (Nov 10, phone load): drawn before the app's script has run, then dropped (shell.ts) as the app draws
         its first screen. Home's own boxes with the app's own classes, so each lands where home's does: only the logo,
         the menus' and the hero's panels and PLAY's outline show. Elsewhere (or before this device has seen home) the
         app's own splash, the same as the one it draws while it finds out who you are. */
      #shell { position: fixed; inset: 0; z-index: 2147483000; display: flex; justify-content: center; overflow: hidden; }
      #shell * { visibility: hidden; }
      #shell .fd-side, #shell .fd-right, #shell .fd-hero, #shell .fd-play, #shell .fd-logo, #shell .fd-logo * { visibility: visible; }
      #shell .fd-play { color: transparent; background: none; box-shadow: inset 0 0 0 2px var(--fd-line); }
      /* While the shell is up it is the splash: the app's own splash under it stays hidden, so the two never show at once. */
      #shell ~ #app .fd-splash { visibility: hidden; }
      /* The loading bar (Nov 10): only once the page has loaded for FRONT_DOOR.loadBarAfterMs (the script below). Under the
         splash's logo, or in the middle of home's hero panel; out of the flow, so nothing else moves when it shows. */
      #shell .fd-splash { position: relative; }
      .hc-load { position: absolute; left: 50%; top: calc(50% + 36px); transform: translateX(-50%); width: min(240px, calc(100vw - 64px));
        display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transition: opacity 0.25s; }
      .fd-hero .hc-load { top: 50%; transform: translate(-50%, -50%); }
      .hc-load.on { opacity: 1; }
      #shell .hc-load.on, #shell .hc-load.on * { visibility: visible; }
      #shell .hc-load:not(.failed) .hc-load-retry { visibility: hidden; }
      .hc-load-track { width: 100%; height: 4px; border-radius: 2px; background: var(--fd-line); overflow: hidden; }
      .hc-load-fill { height: 100%; background: var(--fd-gold); transform: scaleX(0.1); transform-origin: left; transition: transform 0.5s ease-out; }
      .hc-load-line { margin: 0; font: 500 14px/20px Archivo, system-ui, sans-serif; color: var(--fd-sub); white-space: nowrap; }
      .hc-load.failed .hc-load-line { color: var(--fd-text); }
      /* (Under the line, out of the box's own height: the bar and its line are what's centered.) */
      .hc-load-retry { position: absolute; top: calc(100% + 12px); }
    </style>
  </head>
  <body>
    <div id="shell" aria-hidden="true"><div class="fd-root framed fd-on-home"><nav class="fd-side"><button class="fd-logo">Hun<span>Chess</span></button><div class="fd-menu"><button class="fd-menu-item on"><span class="fd-menu-icon"></span><span>Play</span></button><button class="fd-menu-item"><span class="fd-menu-icon"></span><span>Chess Town</span></button><button class="fd-menu-item"><span class="fd-menu-icon"></span><span>Boss Battle</span></button><button class="fd-menu-item"><span class="fd-menu-icon"></span><span>Play with friends</span></button><button class="fd-menu-item"><span class="fd-menu-icon"></span><span>Shop &amp; crates</span></button><button class="fd-menu-item"><span class="fd-menu-icon"><span class="fd-pawn fd-pawn-ring"><span class="fd-pawn-box"><span class="avatar hb-pieces"></span></span></span></span><span>Profile</span></button></div><div class="fd-menu fd-menu-end"><button class="fd-menu-item"><span class="fd-menu-icon"></span><span>Settings</span></button></div></nav><main class="fd-center"><div class="fd-home"><header class="fd-top"><div class="fd-logo">Hun<span>Chess</span></div><div class="fd-top-end"><div class="fd-top-right"><button class="fd-ring"><span class="fd-pawn fd-pawn-ring"><span class="fd-pawn-box"><span class="avatar hb-pieces"></span></span></span></button></div><button class="fd-icon-btn fd-top-quests"></button><button class="fd-icon-btn fd-top-shop"></button><button class="fd-icon-btn fd-top-friends"></button><button class="fd-icon-btn fd-top-gear"></button></div></header><div class="fd-live"><span class="fd-dot off"></span><span class="fd-live-wait">&nbsp;</span></div><div class="fd-home-main"><section class="fd-hero fd-has-quests"><div class="fd-hero-in"><span class="fd-pawn fd-pawn-hero shadow fd-tap"><span class="fd-hop"><span class="fd-pawn-box"><span class="avatar hb-pieces"></span></span></span></span><div class="fd-hero-id"><span class="fd-hero-icon"><button class="fd-hero-iconbtn"><span class="user-icon">♟</span></button></span><div class="fd-hero-text"><button class="fd-hero-namebtn"><span class="fd-hero-name">Player</span><span class="fd-hero-sub">&nbsp;</span></button></div></div></div><button class="fd-quests-btn"><span>Quests</span></button></section><div class="fd-play-col"><section class="fd-livewin"></section><div class="fd-ranked"><h2 class="fd-label">RANKED</h2><div class="fd-modes"><button>50 v 50<br><span>Crowd chess</span></button><button>1 v 1<br><span>Classic chess</span></button><button>Squads<br><span>8 squads of 4</span></button></div></div><div class="fd-mode-panel idle"><div class="fd-modes fd-types fd-three"><button>Solo queue<br><span>join a lobby</span></button><button class=" off">Party<br><span>Soon</span></button><button>Bots<br><span>99 bots, now</span></button></div></div><div class="fd-go"><div class="fd-hint"><span>Tap a game mode to get started</span></div><button class="fd-play">PLAY</button></div><button class="fd-town"><span class="fd-town-label">Chess Town</span></button><h2 class="fd-label fd-other-label">Other modes</h2><div class="rd-pair"><button class="rd-card rd-half"><span class="rd-face"><span class="rd-face-stack"><span class="rd-face-one"></span></span></span><span class="rd-card-text"><strong>Boss Battle</strong><span>Any boss, up to 3</span></span></button><button class="rd-card rd-half fd-auto-card"><span class="rd-face"></span><span class="rd-card-text"><strong>Auto chess</strong><span>Build an army</span></span></button></div></div></div></div></main><aside class="fd-right"></aside></div></div>
    <script>
      // Home's shell only at home's address, on a device that has seen home (shell.ts keeps the mark); else the splash.
      (function () {
        var home = false;
        try {
          home = location.pathname === "/" && !location.search && localStorage.getItem("brc.homeShell") === "1";
        } catch (e) {}
        if (!home) document.getElementById("shell").innerHTML = '<div class="fd-splash"><div class="fd-logo">Hun<span>Chess</span></div></div>';
      })();
      // The loading bar (Eric, Nov 10): hidden for the first AFTER ms (most loads are done by then), then a thin bar and the step
      // loading now. The app moves it as each step finishes (loadbar.ts calls hcLoad); it never goes back. No step for STALL ms, or
      // a script that won't load: the line says so, with "Try again". Gone with the shell as the first real screen draws.
      (function () {
        var AFTER = 2000, STALL = 20000; // FRONT_DOOR.loadBarAfterMs and loadBarStallMs (a unit test checks they agree)
        var shell = document.getElementById("shell");
        var bar = document.createElement("div");
        bar.className = "hc-load";
        bar.innerHTML = '<div class="hc-load-track"><div class="hc-load-fill"></div></div><p class="hc-load-line">Loading the game…</p>' +
          '<button type="button" class="fd-btn primary small hc-load-retry">Try again</button>';
        (shell.querySelector(".fd-hero") || shell.querySelector(".fd-splash")).appendChild(bar);
        var fill = bar.firstChild.firstChild, line = bar.childNodes[1], at = 0.1, stall = 0;
        bar.lastChild.onclick = function () { location.reload(); };
        function fail(text) {
          if (!bar.isConnected) return;
          line.textContent = text;
          bar.className = "hc-load on failed";
        }
        function wait() {
          clearTimeout(stall);
          stall = setTimeout(function () { fail("This is taking too long."); }, STALL);
        }
        wait();
        setTimeout(function () { if (bar.className === "hc-load") bar.className = "hc-load on"; }, Math.max(0, AFTER - performance.now()));
        window.hcLoadFail = function () { fail("Couldn't load the game."); };
        if (window.hcLoadFailed) window.hcLoadFail();
        window.hcLoad = function (to, text) {
          if (!bar.isConnected || bar.className.indexOf("failed") >= 0) return;
          if (to > at) fill.style.transform = "scaleX(" + (at = to) + ")";
          line.textContent = text;
          wait();
        };
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
