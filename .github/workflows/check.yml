# Runs on every pull request (and on main): the typecheck and the unit tests. A red check means don't merge.
# The e2e suite (Playwright on emulated phones and computers) runs in its own workflow: e2e.yml.
name: check
on:
  pull_request:
  push:
    branches: [main]
# Main runs one at a time (Nov 1): a push while main's check is going waits, never cancelling it, and a newer push
# replaces the one waiting (it checks every merge since). Pull requests: a run each, as before.
concurrency:
  group: ${{ github.event_name == 'push' && 'check-main' || format('check-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
