# Runs on every pull request (and on main): the typecheck and the unit tests. A red check means don't merge.
# The e2e suite (Playwright on emulated phones and computers) runs in its own workflow: e2e.yml.
# Three jobs side by side (Nov 6): `unit` (every test outside packages/chess/test), `chess` (the typecheck since Nov 9, and packages/chess's
# tests: the boss simulations, 61% of the test time) and `check`, green when both are: the one to read, as before.
name: check
on:
  pull_request:
  push:
    branches: [main]
# Main runs one at a time (Nov 1): a push while main's check is going waits, never cancelling it, and a newer push
# replaces the one waiting (it checks every merge since). A pull request (Nov 6): a new push cancels its run still
# going, as e2e.yml does, so superseded runs don't hold runner slots.
concurrency:
  group: ${{ github.event_name == 'push' && 'check-main' || format('check-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # (A pull request's checkout is its merge commit; HEAD^1 is main as it is now.)
          fetch-depth: 2
      # Stills and GIFs stay out of the repo (Nov 6: history already holds 420 MB of images). A pull request may add an
      # image under docs/ only if a test reads it: list it in FIXTURES (none today; no test reads an image in docs/).
      - name: No new images under docs/
        if: ${{ github.event_name == 'pull_request' }}
        env:
          FIXTURES: ""
        run: |
          added=$(git -c core.quotepath=off diff --name-only --diff-filter=A HEAD^1 HEAD -- docs | grep -iE '\.(png|gif|jpe?g)$' || true)
          bad=$(printf '%s\n' "$added" | while IFS= read -r f; do case " $FIXTURES " in *" $f "*) ;; *) [ -z "$f" ] || echo "$f";; esac; done)
          if [ -n "$bad" ]; then
            echo "::error::This pull request adds images under docs/. Keep stills and GIFs untracked (stills/, frames/) and send their paths instead; an image a test reads goes in FIXTURES (check.yml)."
            echo "$bad"
            exit 1
          fi
      # A new file under packages/ (or a new spec) that e2e/areas.json doesn't place would run every e2e spec on every
      # pull request that touches it; this names it in the first minute (Nov 10, audit F3). Plain Node: no install.
      - name: Every new file is in e2e/areas.json
        if: ${{ github.event_name == 'pull_request' }}
        run: node e2e/ci-select.mjs unmapped HEAD^1
      # Decision notes stay short (CLAUDE.md: "a decision note of about five lines"): the Nov 12 bloat sweep found 116 notes and
      # 34k words in 3.5 days, every helper re-reading them; Nov 16 (T4, Eric's OK): 250 -> 200 words. A warning, not a failure.
      - name: New decision notes are short
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          for f in $(git -c core.quotepath=off diff --name-only --diff-filter=A HEAD^1 HEAD -- docs/decisions | grep '\.md$' || true); do
            w=$(wc -w < "$f")
            if [ "$w" -gt 200 ]; then echo "::warning file=$f::$f is $w words. Keep a decision note to about 150 words (Eric's words, what changed, the calls made); tables and test lists go in the PR body."; fi
          done
      # PR bodies stay short too (the Nov 16 bloat sweep, T4: 43% over 40 lines; Eric's OK, Nov 16). A warning, not a failure.
      # At 40 lines since Nov 26 (was 60; the Nov 26 sweep, Q3, Eric's go-ahead): the cap the helpers' brief sets.
      - name: The PR body is short
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          n=$(printf '%s\n' "$BODY" | wc -l)
          if [ "$n" -gt 40 ]; then echo "::warning::The PR body is $n lines. Keep it to what changed, what players see and the changed checks (old -> new); detail goes on the area page."; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (all but packages/chess, which `chess` runs)
        run: npx vitest run --exclude "packages/chess/test/**"

  # (Two halves since Nov 19: the tower's kit and layer tests doubled this job, which then set check's time; the sweep's N2,
  # Eric's OK. Every test still runs on every PR, half on each runner.) Split by time since Nov 23 (Eric: "Yes, rebalance"):
  # vitest's --shard split by file count, 1 : 2.8 by time. Half 1 is HALF1 (the slowest files by CI's own
  # times, Nov 23); half 2 is the typecheck and every other file. One list, so every file runs exactly once; rebalance by moving names.
  chess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HALF1: >-
        packages/chess/test/boss-kit-side.test.ts packages/chess/test/several-bosses.test.ts
        packages/chess/test/boss-kit.test.ts packages/chess/test/square-layer-twin.test.ts
        packages/chess/test/held-layer-twin.test.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (The typecheck runs here, off the unit job's critical path (the Nov 9 audit, F7), on the second half since Nov 26: half 1's
      # slow files had made it the long pole, 421 s against 304 s (the Nov 26 bloat sweep, Q1; Eric: "you can move the GitHub test
      # server thing"). edge-layer-twin moved to half 2 with it.)
      - if: ${{ matrix.shard == 2 }}
        run: npm run typecheck
      - if: ${{ matrix.shard == 1 }}
        name: packages/chess's tests (half 1 of 2, the slowest files)
        run: npx vitest run $HALF1
      - if: ${{ matrix.shard == 2 }}
        name: packages/chess's tests (half 2 of 2, the rest)
        run: npx vitest run packages/chess/test $(for f in $HALF1; do printf -- '--exclude %s ' "$f"; done)

  # (The name every reader and rule knows: green only when both jobs are.)
  check:
    if: ${{ !cancelled() }}
    needs: [unit, chess]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The typecheck and every unit test green
        if: ${{ needs.unit.result != 'success' || needs.chess.result != 'success' }}
        run: exit 1
      - run: echo "unit and chess passed"
