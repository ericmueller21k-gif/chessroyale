# The Playwright e2e suite (both projects, phone and desktop). Docs: docs/areas/ops.md, "CI e2e"; CLAUDE.md, "Test lanes".
#
# - A pull request runs a fast check: the specs of the areas it changes plus a small smoke set, on as few shards as they
#   need (about 15 to 20 minutes for a targeted PR, Nov 6). The `plan` job picks them (e2e/ci-select.mjs, from
#   e2e/areas.json: path globs to spec files) and says why on the run's page. A shared foundation (package.json, the lockfile, the
#   Playwright config, packages/core, the runner, the protocol, …) or a path the table doesn't know runs every spec, as
#   does the `full-e2e` label (adding it starts a new run). settings.ts, e2e/helpers.ts and a few shared app modules
#   (`traced` in areas.json) are followed through the code instead: the specs of what uses what the diff changes.
# - A push to main (and a manual run) runs every spec on 15 shards (10 until Nov 9: about 28 minutes, Nov 6), plus any wait for runners:
#   the full run after each merge. One main run at a time: a push waits for the run going, and only the newest
#   waiting push runs (it covers the others).
#
# Each shard runs whole spec files, spread by the plan so the slowest shard ends soonest: by each file's time in each
# project, as main's last green run measured it (e2e/ci-timings.json for files it didn't), and the order Playwright's 2
# workers take them in (e2e/ci-select.mjs, `assign`; e2e/ci-shard.mjs shows a shard locally). The `result`
# job puts one summary on the run's page (flaky tests first, then failed ones, each with its shard and error;
# e2e/ci-summary.ts, ci-summary-merge.mjs) and is red if the plan or any shard is.
#
# Retries: 1 here until the flaky-test batch lands (the goal is 0, as playwright.config.ts has it). A test that passes
# on the retry is "flaky": listed at the top of the summary, never hidden. Each test's first try is recorded and the
# recording kept only if that try fails (`retain-on-first-failure`, Eric Nov 14: the failing try is the one worth
# watching; recording every first try costs about 8% more time). A shard with a failed or flaky test uploads its HTML
# report with those traces (artifact `e2e-report-shard-N`, kept 7 days).
#
# Left out here: the @perf specs (e2e/perf.spec.ts), whose frame budgets depend on the machine's speed. Run them
# locally, or from Actions → e2e → Run workflow with "perf" ticked (instead of the suite).
#
# Not a required check yet: Eric decides once it has proven itself over a few PRs (then require `result`).
name: e2e
on:
  pull_request:
    branches: [main]
    # (`labeled`: adding the full-e2e label starts a full run at once. Any other label restarts the run as it was.)
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      perf:
        description: "Run the @perf specs (frame budgets, slowed phone) instead of the suite"
        type: boolean
        default: false

# A new push to a PR (or a label added to it) cancels the PR's run still going. Main runs one at a time (Nov 1): a push
# while main's run is going waits, never cancelling it, and a newer push replaces the one waiting, so the next run tests
# main with every merge since the last one (the plan's summary lists them). A manual run has its own group.
concurrency:
  group: ${{ github.event_name == 'push' && 'e2e-main' || format('e2e-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app is built in its own step, so Playwright's web server only starts wrangler (playwright.config.ts).
  E2E_PREBUILT: "1"
  PLAYWRIGHT_HTML_OPEN: never
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Every job runs on ubuntu-24.04, pinned (Oct 28, 2026): ubuntu-latest became 26.04, where Playwright 1.56.1 can't
  # install chromium-headless-shell's dependencies ("does not support chromium-headless-shell on ubuntu26.04-x64").
  # Unpin when Playwright supports 26.04.
  # Which spec files this run tests and on how many shards (e2e/ci-select.mjs: plain Node, so no install). A pull
  # request's checkout is its merge commit; its first parent is main as it is now, so the diff is what the PR changes.
  plan:
    if: ${{ !inputs.perf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # (actions: read, for a push to main: the last main run that wasn't skipped.)
    permissions:
      contents: read
      actions: read
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
      assignment: ${{ steps.plan.outputs.assignment }}
      note: ${{ steps.plan.outputs.note }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The test times the shards are spread by: main's last green run's records (each shard's e2e-summary, by file
          # and project), for every file it measured; e2e/ci-timings.json for the rest, or when they can't be had.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.run_number)"' || true)
          if [ -n "$last" ] && gh run download "${last% *}" -R "$GITHUB_REPOSITORY" -p 'e2e-summary-*' -D e2e-last; then
            export E2E_LIVE_TIMINGS=e2e-last E2E_LIVE_RUN="${last#* }"
          fi
          # (HEAD^1: for a pull request, main as it is now. A manual run has no base: everything.)
          if [ "$EVENT" = workflow_dispatch ]; then node e2e/ci-select.mjs full "this is a $EVENT run, which tests everything"
          elif [ "$EVENT" != pull_request ]; then
            # A push to main: its base is the commit of main's last run that wasn't skipped (or cancelled); HEAD^1 if that
            # can't be had. The summary lists the merges since then: what this run covers.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?branch=main&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .conclusion != \"cancelled\")][0].head_sha // empty" || true)
            if [ -z "$base" ] || ! git fetch --no-tags --depth=1 origin "$base"; then base=$(git rev-parse HEAD^1); fi
            merges=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" \
              --jq '.commits[] | select(.parents | length > 1) | "- `" + .sha[0:8] + "` " + (.commit.message | split("\n")[0])' || true)
            if [ -n "$merges" ]; then printf '%s\n\n%s\n\n' "### The merges this run covers (since main's last run, \`${base:0:8}\`)" "$merges" >> "$GITHUB_STEP_SUMMARY"; fi
            node e2e/ci-select.mjs full "this is a $EVENT run, which tests everything"
          elif [ "$FULL_LABEL" = true ]; then node e2e/ci-select.mjs full "the pull request has the full-e2e label"
          else node e2e/ci-select.mjs diff HEAD^1
          fi

  # The shards.
  # The shards and `perf` run in Playwright's own image (Nov 6), matching the lockfile's @playwright/test: Chromium, its
  # system libraries and fonts come with it. Installing them on the runner took 10-23 s, but 8 of 60 shards took 2-13
  # minutes (apt's fonts at 18 kB/s from the runner's mirror). Bump the tag with @playwright/test; the first step checks.
  # (--ipc=host: Chromium's shared memory, as Playwright's Docker docs advise.)
  shard:
    needs: plan
    name: ${{ format('shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # A full run's shard tests for about 20 minutes; the rest is headroom for a stalled test and its retry.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      E2E_SHARD_LABEL: ${{ format('Shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
      # (Relative: in a container job, github.workspace is the runner's path, not the container's.)
      E2E_SUMMARY_FILE: e2e-summary/shard-${{ matrix.shard }}.json
      SHARD: ${{ matrix.shard }}
      # Each shard's spec files, as the plan spread them (a JSON list of Playwright filters, shard 1 first).
      ASSIGNMENT: ${{ needs.plan.outputs.assignment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The image matches the lockfile's Playwright
        run: |
          v=$(node -p 'require("@playwright/test/package.json").version')
          [ "$v" = 1.56.1 ] || { echo "::error::@playwright/test is $v: change the container image tag to v$v (e2e.yml, shard and perf)"; exit 1; }
      # (Not `npm run build`: the app's build typechecks first, which `check` already does.)
      - name: Build the app
        run: npm run build -w maia-worker && (cd packages/app && npx vite build)
      - name: Run ${{ format('shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
        run: |
          files=$(node -p 'JSON.parse(process.env.ASSIGNMENT)[process.env.SHARD - 1] ?? ""')
          echo "Files: $files"
          # (No files would run the whole suite here: never expected, as the plan has a file for every shard.)
          [ -n "$files" ] || { echo "No spec files for this shard"; exit 1; }
          npx playwright test $files --grep-invert @perf --forbid-only --retries 1 --trace retain-on-first-failure \
            --reporter=list,github,html,./e2e/ci-summary.ts
      # (Kept 90 days, the most GitHub keeps: each run's failed and flaky tests, for a look at which tests catch real bugs
      # and which only flake (Eric, Oct 18). Under a kilobyte a shard.)
      - name: Keep the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-summary-${{ matrix.shard }}
          path: e2e-summary/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
      # (On a failure, or when a test only passed on its retry: e2e/ci-summary.ts leaves shard-N.flaky.)
      - name: Keep the report
        if: ${{ failure() || hashFiles('e2e-summary/*.flaky') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  result:
    if: ${{ !cancelled() && !inputs.perf }}
    needs: [plan, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NOTE: ${{ needs.plan.outputs.note }}
      SHARDS: ${{ needs.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: e2e
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-summary-*
          path: e2e-summary
          merge-multiple: true
      - name: Summary
        if: ${{ needs.plan.result == 'success' }}
        env:
          # (Main's run is red on a test that passed only on its retry: the summary's title says "red: flaky only (N)".)
          FLAKY_RED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: node e2e/ci-summary-merge.mjs "$SHARDS" e2e-summary "$NOTE" >> "$GITHUB_STEP_SUMMARY"
      # A test that passed only on its retry fails main's run (Nov 10, audit F1, after the second flaky batch): the retry
      # stays, but no longer hides a flake; the failed first try's trace shows why. Pull requests aren't held up by one.
      - name: No flaky test on main
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.shard.result == 'success' }}
        run: |
          if ls e2e-summary/*.flaky >/dev/null 2>&1; then
            echo "### A test passed only on its retry, so main is red: fix it at its cause (its trace is in the shard's e2e-report artifact)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # (A run red with no failed test, Nov 9 audit F2: GitHub dropped the shards or this job. Said plainly, so the director
      # re-runs it once instead of hunting for a test.)
      - name: The plan and every shard green
        if: ${{ needs.plan.result != 'success' || needs.shard.result != 'success' }}
        env:
          PLAN: ${{ needs.plan.result }}
          SHARD: ${{ needs.shard.result }}
        run: |
          if [ "$PLAN" = "success" ] && [ "$SHARD" != "failure" ]; then
            echo "### No test failed: the shards were $SHARD (GitHub didn't run them). Re-run this run once." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  perf:
    if: ${{ inputs.perf }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The image matches the lockfile's Playwright
        run: |
          v=$(node -p 'require("@playwright/test/package.json").version')
          [ "$v" = 1.56.1 ] || { echo "::error::@playwright/test is $v: change the container image tag to v$v (e2e.yml, shard and perf)"; exit 1; }
      - name: Build the app
        run: npm run build -w maia-worker && (cd packages/app && npx vite build)
      # One worker, so the specs don't share the runner's CPU with each other. A runner is neither Eric's phone nor the
      # local machine: read the numbers as a trend, not a verdict.
      - name: Run the perf specs
        run: npx playwright test --grep @perf --project phone --workers 1 --forbid-only --reporter=list,github,html
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-perf-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
