# The Playwright e2e suite (both projects, phone and desktop). Docs: docs/areas/ops.md, "CI e2e"; CLAUDE.md, "Test lanes".
#
# - A pull request runs a fast check: the specs of the areas it changes plus a small smoke set, on as few shards as they
#   need (about 4 to 8 minutes in all). The `plan` job picks them (e2e/ci-select.mjs, from e2e/areas.json: path
#   globs to spec files) and says why on the run's page. A shared foundation (package.json, the lockfile, the
#   Playwright config, packages/core, the runner, the protocol, …) or a path the table doesn't know runs every spec, as
#   does the `full-e2e` label (adding it starts a new run). settings.ts, e2e/helpers.ts and a few shared app modules
#   (`traced` in areas.json) are followed through the code instead: the specs of what uses what the diff changes.
# - A push to main (and a manual run) runs every spec on 5 shards, about 44 minutes: the full run after each merge. One
#   main run at a time: a push waits for the run going, and only the newest waiting push runs (it covers the others).
# - A change to the town's area (e2e/areas.json, `webgl`) also runs the town's drawing specs again on a VITE_TOWN_GL=1
#   build (WebGL the town's default; the runners have no GPU, so it's software WebGL): two more jobs beside the shards,
#   `webgl-phone` and `webgl-desktop` in the shard matrix, one project and one worker each (two software-WebGL pages at
#   once on a runner's 4 CPUs make each check slow enough to miss the chat's and the tags' timings). On a PR, on a push
#   to main that merged one, with the full-e2e label; a manual run always.
#
# Each shard runs whole spec files, spread by their measured time (e2e/ci-shard.mjs, e2e/ci-timings.json). The `result`
# job puts one summary on the run's page (flaky tests first, then failed ones, each with its shard and error;
# e2e/ci-summary.ts, ci-summary-merge.mjs) and is red if the plan or any shard is.
#
# Retries: 1 here until the flaky-test batch lands (the goal is 0, as playwright.config.ts has it). A test that passes
# on the retry is "flaky": listed at the top of the summary, never hidden. Traces only on that retry (recording every
# test costs about 8% more time). A shard with a failed or flaky test uploads its HTML report with those traces
# (artifact `e2e-report-shard-N`, kept 7 days).
#
# Left out here: the @perf specs (e2e/perf.spec.ts), whose frame budgets depend on the machine's speed. Run them
# locally, or from Actions → e2e → Run workflow with "perf" ticked (instead of the suite).
#
# Not a required check yet: Eric decides once it has proven itself over a few PRs (then require `result`).
name: e2e
on:
  pull_request:
    branches: [main]
    # (`labeled`: adding the full-e2e label starts a full run at once. Any other label restarts the run as it was.)
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      perf:
        description: "Run the @perf specs (frame budgets, slowed phone) instead of the suite"
        type: boolean
        default: false

# A new push to a PR (or a label added to it) cancels the PR's run still going. Main runs one at a time (Nov 1): a push
# while main's run is going waits, never cancelling it, and a newer push replaces the one waiting, so the next run tests
# main with every merge since the last one (the plan's summary lists them). A manual run has its own group.
concurrency:
  group: ${{ github.event_name == 'push' && 'e2e-main' || format('e2e-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app is built in its own step, so Playwright's web server only starts wrangler (playwright.config.ts).
  E2E_PREBUILT: "1"
  PLAYWRIGHT_HTML_OPEN: never
  WRANGLER_SEND_METRICS: "false"

jobs:
  # Every job runs on ubuntu-24.04, pinned (Oct 28, 2026): ubuntu-latest became 26.04, where Playwright 1.56.1 can't
  # install chromium-headless-shell's dependencies ("does not support chromium-headless-shell on ubuntu26.04-x64").
  # Unpin when Playwright supports 26.04.
  # Which spec files this run tests and on how many shards (e2e/ci-select.mjs: plain Node, so no install). A pull
  # request's checkout is its merge commit; its first parent is main as it is now, so the diff is what the PR changes.
  plan:
    if: ${{ !inputs.perf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # (actions: read, for a push to main: the last main run that wasn't skipped.)
    permissions:
      contents: read
      actions: read
    outputs:
      specs: ${{ steps.plan.outputs.specs }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
      webgl: ${{ steps.plan.outputs.webgl }}
      note: ${{ steps.plan.outputs.note }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # (HEAD^1: for a pull request, main as it is now. A manual run has no base: everything.)
          if [ "$EVENT" = workflow_dispatch ]; then node e2e/ci-select.mjs full "this is a $EVENT run, which tests everything"
          elif [ "$EVENT" != pull_request ]; then
            # A push to main: its base is the commit of main's last run that wasn't skipped (or cancelled), so the WebGL
            # jobs see every merge this run covers; HEAD^1 if that can't be had. The summary lists those merges.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?branch=main&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .conclusion != \"cancelled\")][0].head_sha // empty" || true)
            if [ -z "$base" ] || ! git fetch --no-tags --depth=1 origin "$base"; then base=$(git rev-parse HEAD^1); fi
            merges=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" \
              --jq '.commits[] | select(.parents | length > 1) | "- `" + .sha[0:8] + "` " + (.commit.message | split("\n")[0])' || true)
            if [ -n "$merges" ]; then printf '%s\n\n%s\n\n' "### The merges this run covers (since main's last run, \`${base:0:8}\`)" "$merges" >> "$GITHUB_STEP_SUMMARY"; fi
            node e2e/ci-select.mjs full "this is a $EVENT run, which tests everything" "$base"
          elif [ "$FULL_LABEL" = true ]; then node e2e/ci-select.mjs full "the pull request has the full-e2e label" HEAD^1
          else node e2e/ci-select.mjs diff HEAD^1
          fi

  # The shards, and (`webgl-phone`, `webgl-desktop` in the matrix) the town's drawing specs again on a build where WebGL is
  # the town's default.
  shard:
    needs: plan
    name: ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && format('the town on WebGL, {0}', matrix.shard) || format('shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
    runs-on: ubuntu-24.04
    # A full run's shard tests for about 30 minutes; the system libraries' install (apt, below) has taken up to 16 on a
    # slow runner (Oct 26), so 45 cut two shards off mid-run with every test still green.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      E2E_SHARD_LABEL: ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && format('The town on WebGL, {0}', matrix.shard) || format('Shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
      E2E_SUMMARY_FILE: ${{ github.workspace }}/e2e-summary/shard-${{ matrix.shard }}.json
      SHARD: ${{ matrix.shard }}
      # The plan's spec files (empty: every spec file); the WebGL jobs' own.
      SPECS: ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && needs.plan.outputs.webgl || needs.plan.outputs.specs }}
      TOTAL: ${{ needs.plan.outputs.total }}
      # The WebGL jobs: the build makes WebGL the town's default (test-switches.ts, TOWN_ASKED), and town-webgl.spec.ts's
      # check of the default knows it.
      VITE_TOWN_GL: ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && '1' || '' }}
      TOWN_GL_BUILD: ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      # (The download is skipped when the cache has it; the system libraries are installed either way.)
      - name: Install Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build the app
        run: npm run build
      - name: Run ${{ startsWith(format('{0}', matrix.shard), 'webgl-') && format('the town on WebGL, {0}', matrix.shard) || format('shard {0} of {1}', matrix.shard, needs.plan.outputs.total) }}
        run: |
          # (A WebGL job: all its files, its one project, one worker.)
          only=""
          case "$SHARD" in
            webgl-*) files=$(node e2e/ci-shard.mjs 1 1 $SPECS); only="--project ${SHARD#webgl-} --workers 1" ;;
            *) files=$(node e2e/ci-shard.mjs "$SHARD" "$TOTAL" $SPECS) ;;
          esac
          echo "Files: $files $only"
          # (No files would run the whole suite here: never expected, as the plan has a file for every shard.)
          [ -n "$files" ] || { echo "No spec files for this shard"; exit 1; }
          npx playwright test $files $only --grep-invert @perf --forbid-only --retries 1 --trace on-first-retry \
            --reporter=list,github,html,./e2e/ci-summary.ts
      # (Kept 90 days, the most GitHub keeps: each run's failed and flaky tests, for a look at which tests catch real bugs
      # and which only flake (Eric, Oct 18). Under a kilobyte a shard.)
      - name: Keep the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ matrix.shard }}
          path: e2e-summary/
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
      # (On a failure, or when a test only passed on its retry: e2e/ci-summary.ts leaves shard-N.flaky.)
      - name: Keep the report
        if: ${{ failure() || hashFiles('e2e-summary/*.flaky') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  result:
    if: ${{ !cancelled() && !inputs.perf }}
    needs: [plan, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NOTE: ${{ needs.plan.outputs.note }}
      SHARDS: ${{ needs.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-summary-*
          path: e2e-summary
          merge-multiple: true
      - name: Summary
        if: ${{ needs.plan.result == 'success' }}
        run: node e2e/ci-summary-merge.mjs "$SHARDS" e2e-summary "$NOTE" >> "$GITHUB_STEP_SUMMARY"
      - name: The plan and every shard green
        if: ${{ needs.plan.result != 'success' || needs.shard.result != 'success' }}
        run: exit 1

  perf:
    if: ${{ inputs.perf }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build the app
        run: npm run build
      # One worker, so the specs don't share the runner's CPU with each other. A runner is neither Eric's phone nor the
      # local machine: read the numbers as a trend, not a verdict.
      - name: Run the perf specs
        run: npx playwright test --grep @perf --project phone --workers 1 --forbid-only --reporter=list,github,html
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-perf-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
