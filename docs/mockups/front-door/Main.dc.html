<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HunChess home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Archivo+Black&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Archivo,system-ui,sans-serif}
a{color:#f2c14e;text-decoration:none}a:hover{color:#ffd978}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14161b; color: #eef0f4; display: flex; flex-direction: column; padding: 20px 18px 22px; gap: 16px; font-family: Archivo, system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: 'Archivo Black', Archivo, sans-serif; font-size: 24px; letter-spacing: -0.5px">Hun<span style="color: #f2c14e">Chess</span></div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="font-size: 14px; font-weight: 600; color: #f2c14e; background: #232731; border-radius: 999px; padding: 8px 12px">● 1,240 coins</div>
      <a href="Profile.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; border-radius: 50%; background: #232731; display: flex; align-items: center; justify-content: center; border: 2px solid #f2c14e">
        <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><g transform="scale(2.2222)"><path d="m 22.5,9 c -2.21,0 -4,1.79 -4,4 0,0.89 0.29,1.71 0.78,2.38 C 17.33,16.5 16,18.59 16,21 c 0,2.03 0.94,3.84 2.41,5.03 C 15.41,27.09 11,31.58 11,39.5 H 34 C 34,31.58 29.59,27.09 26.59,26.03 28.06,24.84 29,23.03 29,21 29,18.59 27.67,16.5 25.72,15.38 26.21,14.71 26.5,13.89 26.5,13 c 0,-2.21 -1.79,-4 -4,-4 z" fill="#fff" stroke="#000" stroke-width="1.5"></path></g><g transform="translate(0 3)"><path d="M37 21 Q39 6 54 5 Q67 5 72 15 L67 18 Q62 12 56 12 Q61 16 63 21 Z" fill="#d6342f" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"></path><rect x="33" y="18" width="34" height="8" rx="4" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></rect><circle cx="70" cy="18" r="4.6" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></circle></g></svg>
      </a>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #b9bec9">
    <span style="width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 4px rgba(74,222,128,0.18)"></span>
    <span><strong style="color: #eef0f4">214 online</strong> · 9 matches running · 31 in queue</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #1b1e25; border-radius: 22px; padding: 18px">
    <svg viewBox="-12 -10 124 112" width="170" height="154" aria-hidden="true">
      <ellipse cx="50" cy="94" rx="30" ry="5" fill="#000" opacity="0.35"></ellipse>
      <g transform="scale(2.2222)"><path d="m 22.5,9 c -2.21,0 -4,1.79 -4,4 0,0.89 0.29,1.71 0.78,2.38 C 17.33,16.5 16,18.59 16,21 c 0,2.03 0.94,3.84 2.41,5.03 C 15.41,27.09 11,31.58 11,39.5 H 34 C 34,31.58 29.59,27.09 26.59,26.03 28.06,24.84 29,23.03 29,21 29,18.59 27.67,16.5 25.72,15.38 26.21,14.71 26.5,13.89 26.5,13 c 0,-2.21 -1.79,-4 -4,-4 z" fill="#fff" stroke="#000" stroke-width="1.5"></path></g>
      <g transform="translate(0 3)"><path d="M37 21 Q39 6 54 5 Q67 5 72 15 L67 18 Q62 12 56 12 Q61 16 63 21 Z" fill="#d6342f" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"></path><rect x="33" y="18" width="34" height="8" rx="4" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></rect><circle cx="70" cy="18" r="4.6" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></circle></g>
      <g transform="rotate(14 80 60)"><path d="M86 94 L86 30 A14 14 0 0 0 58 30 L58 33 A3 3 0 0 0 64 33 L64 30 A8 8 0 0 1 80 30 L80 94 A3 3 0 0 0 86 94 Z" fill="#fbfbf8" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"></path></g>
    </svg>
    <div style="text-align: center">
      <div style="font-size: 20px; font-weight: 800">Eric</div>
      <div style="font-size: 14px; color: #b9bec9">Gold II · 1612 · Santa Hat, Candy Cane</div>
    </div>
  </div>

  <div role="radiogroup" aria-label="Mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #1b1e25; padding: 5px; border-radius: 14px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}<br><span style="font-size: 11px; font-weight: 400; opacity: 0.8">{{m.sub}}</span></button>
    </sc-for>
  </div>

  <a href="Queue.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 18px; background: #f2c14e; color: #1a1406; font-family: 'Archivo Black', Archivo, sans-serif; font-size: 24px; letter-spacing: 1px">PLAY</a>
  <div style="text-align: center; font-size: 13px; color: #9aa0ac; margin-top: -8px">{{hint}}</div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 52px; border-radius: 14px; border: 0; background: #232731; color: #eef0f4; font: 600 15px Archivo, sans-serif">Play with friends</button>
    <button style="height: 52px; border-radius: 14px; border: 0; background: #232731; color: #eef0f4; font: 600 15px Archivo, sans-serif">Boss alone</button>
    <button style="height: 52px; border-radius: 14px; border: 0; background: #232731; color: #eef0f4; font: 600 15px Archivo, sans-serif">Shop &amp; crates</button>
    <a href="Profile.dc.html" style="height: 52px; border-radius: 14px; background: #232731; color: #eef0f4; font: 600 15px Archivo, sans-serif; display: flex; align-items: center; justify-content: center">Profile</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'crowd' }; }
  renderVals() {
    const list = [
      { id: 'crowd', label: 'Crowd', sub: '50 v 50', hint: 'Usually about 20 s to find a match' },
      { id: 'raid', label: 'Boss raid', sub: 'up to 50', hint: 'Join a raid; the boss matches the group' },
      { id: 'classic', label: 'Classic', sub: 'coming', hint: 'Classic is being reworked' },
    ];
    const on = 'border: 0; border-radius: 10px; min-height: 52px; background: #f2c14e; color: #1a1406; font: 800 15px Archivo, sans-serif';
    const off = 'border: 0; border-radius: 10px; min-height: 52px; background: transparent; color: #d7dbe3; font: 600 15px Archivo, sans-serif';
    const cur = list.find((m) => m.id === this.state.mode);
    return {
      modes: list.map((m) => ({ ...m, on: String(m.id === this.state.mode), style: m.id === this.state.mode ? on : off, pick: () => this.setState({ mode: m.id }) })),
      hint: cur.hint,
    };
  }
}
</script>
</body>
</html>
