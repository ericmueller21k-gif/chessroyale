<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HunChess queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;family=Archivo+Black&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Archivo,system-ui,sans-serif}
a{color:#f2c14e;text-decoration:none}a:hover{color:#ffd978}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.q-cell svg{animation:drop .4s ease-out both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14161b; color: #eef0f4; display: flex; flex-direction: column; padding: 20px 18px 22px; gap: 14px; font-family: Archivo, system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #232731; display: flex; align-items: center; justify-content: center; color: #eef0f4">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 15px; font-weight: 600; color: #b9bec9">Crowd · 50 v 50</div>
    <div style="width: 44px"></div>
  </div>

  <div style="text-align: center">
    <div style="font-family: 'Archivo Black', Archivo, sans-serif; font-size: 34px">{{count}} <span style="color: #6b7280">/ 100</span></div>
    <div style="font-size: 14px; color: #b9bec9">Finding players · {{left}} s, then bots fill the rest</div>
  </div>

  <div style="height: 6px; border-radius: 3px; background: #232731; overflow: hidden">
    <div style="{{barStyle}}"></div>
  </div>

  <div style="flex-grow: 1; background: #1b1e25; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative">
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
        <div class="q-cell" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{c.filled}}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true" style="{{c.delay}}"><g transform="scale(2.2222)"><path d="m 22.5,9 c -2.21,0 -4,1.79 -4,4 0,0.89 0.29,1.71 0.78,2.38 C 17.33,16.5 16,18.59 16,21 c 0,2.03 0.94,3.84 2.41,5.03 C 15.41,27.09 11,31.58 11,39.5 H 34 C 34,31.58 29.59,27.09 26.59,26.03 28.06,24.84 29,23.03 29,21 29,18.59 27.67,16.5 25.72,15.38 26.21,14.71 26.5,13.89 26.5,13 c 0,-2.21 -1.79,-4 -4,-4 z" fill="{{c.fill}}" stroke="#000" stroke-width="2"></path></g><sc-if value="{{c.hat}}" hint-placeholder-val="{{ false }}"><g transform="translate(0 3)"><path d="M37 21 Q39 6 54 5 Q67 5 72 15 L67 18 Q62 12 56 12 Q61 16 63 21 Z" fill="{{c.hatColor}}" stroke="#1d1d1f" stroke-width="4"></path><rect x="33" y="18" width="34" height="8" rx="4" fill="#f8fafc" stroke="#1d1d1f" stroke-width="4"></rect></g></sc-if></svg>
          </sc-if>
          <sc-if value="{{c.empty}}" hint-placeholder-val="{{ false }}">
            <div style="width: 40%; height: 40%; border-radius: 50%; background: #262a33"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #232731; border-radius: 16px; padding: 10px 12px; margin-top: auto">
      <svg viewBox="-12 -10 124 112" width="64" height="58" aria-hidden="true">
        <g transform="scale(2.2222)"><path d="m 22.5,9 c -2.21,0 -4,1.79 -4,4 0,0.89 0.29,1.71 0.78,2.38 C 17.33,16.5 16,18.59 16,21 c 0,2.03 0.94,3.84 2.41,5.03 C 15.41,27.09 11,31.58 11,39.5 H 34 C 34,31.58 29.59,27.09 26.59,26.03 28.06,24.84 29,23.03 29,21 29,18.59 27.67,16.5 25.72,15.38 26.21,14.71 26.5,13.89 26.5,13 c 0,-2.21 -1.79,-4 -4,-4 z" fill="#fff" stroke="#000" stroke-width="1.5"></path></g>
        <g transform="translate(0 3)"><path d="M37 21 Q39 6 54 5 Q67 5 72 15 L67 18 Q62 12 56 12 Q61 16 63 21 Z" fill="#d6342f" stroke="#1d1d1f" stroke-width="3"></path><rect x="33" y="18" width="34" height="8" rx="4" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></rect><circle cx="70" cy="18" r="4.6" fill="#f8fafc" stroke="#1d1d1f" stroke-width="3"></circle></g>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-weight: 800; font-size: 16px">You're in · seat 1</div>
        <div style="font-size: 13px; color: #b9bec9">Your pawn is gold-ringed in the grid</div>
      </div>
    </div>
  </div>

  <button onClick="{{tick}}" style="height: 48px; border-radius: 14px; border: 1px dashed #3a3f4b; background: transparent; color: #b9bec9; font: 600 14px Archivo, sans-serif">Mockup: tap to simulate players joining</button>
  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #232731; color: #eef0f4; font: 800 17px Archivo, sans-serif">Cancel</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { count: 38 }; }
  renderVals() {
    const n = this.state.count;
    const hats = ['#d6342f', '#2352c9', '#0f9d58', '#f2c14e'];
    const cells = Array.from({ length: 100 }, (_, i) => {
      const filled = i < n;
      const you = i === 0;
      const hat = filled && (you || (i * 7) % 3 === 0);
      return {
        filled, empty: !filled, hat,
        hatColor: you ? '#d6342f' : hats[(i * 5) % hats.length],
        fill: you ? '#fff' : (i % 2 ? '#e9ebef' : '#c9ccd3'),
        delay: you ? 'outline: 2px solid #f2c14e; outline-offset: 1px; border-radius: 6px' : 'animation-delay: ' + ((i % 10) * 30) + 'ms',
      };
    });
    return {
      count: n,
      left: Math.max(0, 60 - Math.round(n / 2)),
      cells,
      barStyle: 'height: 100%; width: ' + n + '%; background: #f2c14e; border-radius: 3px',
      tick: () => this.setState({ count: Math.min(100, n + 9) }),
    };
  }
}
</script>
</body>
</html>
